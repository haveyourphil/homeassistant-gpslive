name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"
            requirements: requirements-test-min.txt
          - python: "3.14"
            requirements: requirements-dev.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: ruff check .
        if: matrix.python == '3.14'
      - run: ruff format --check .
        if: matrix.python == '3.14'
      - run: python -m pytest
      - name: Check release tag matches the manifest
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("custom_components/gpslive/manifest.json").read_text())["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != version:
              raise SystemExit(f"Release tag {tag!r} must match manifest version {version!r}")
          PY
